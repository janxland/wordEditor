# 湖南工商大学 · 管科：H1=一、 H2=（一） H3=1. H4=1.1（H1/H2 中文数字，H3+ 阿拉伯）
extends: "../_shared/hutb-base.yaml"
template:
  id: "hutb-guanke"
  name: "湖南工商大学 · 管科"

default_list_style: "DecimalList"

use_list_styles:
  - id: "DecimalList"
  - id: "BulletList"
  - id: "ParenDecimalList"
  - id: "CircledList"
  - id: "ChineseList"

overrides:
  - match: { kind: "body" }
    word_wrap_break_latin: true
  - match: { kind: "heading" }
    word_wrap_break_latin: true
    clear_indent: true
    latin_font: "inherit"
  - match:
      id: "1"         # 标题 1 段落
    paragraph:
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      page_break_before: true   # 每个一级标题前自动分页（新章节起新页）
custom_styles:
  - id: "ZhaiYaoTitle"
    name: "摘要标题"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      indent_clear: true
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 36
      size_cs_half_pt: 36
      bold: true
  - id: "ZhaiYao"
    name: "摘要"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: 1.5
      first_line_chars: 2
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
  - id: "KeyWordsZh"
    name: "关键词"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: 1.5
      first_line_chars: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
fonts:
  latin: "Times New Roman"
  cjk: "宋体"

multilevel_list:
  num_id: 2
  levels:
    - ilvl: 0
      heading_style: "1"
      num_fmt: "chineseCounting"
      lvl_text: "%1、"
      suff: "nothing"
      start: 1
    - ilvl: 1
      heading_style: "2"
      num_fmt: "chineseCounting"
      lvl_text: "（%2）"
      suff: "nothing"
      start: 1
    - ilvl: 2
      heading_style: "3"
      num_fmt: "decimal"
      lvl_text: "%3."
      suff: "space"
      start: 1
    - ilvl: 3
      heading_style: "4"
      num_fmt: "decimal"
      lvl_text: "%3.%4"
      suff: "space"
      start: 1
