# Shared base DSL for HUTB templates.
# 注：default_list_style / use_list_styles 由各子模板自行声明，以避免 list-merge 重复。
extends: "./list-style-library.yaml"

fonts:
  latin: "Times New Roman"
  cjk: "宋体"

overrides:
  - match: { kind: "body" }
    word_wrap_break_latin: true
  - match: { kind: "heading" }
    word_wrap_break_latin: true
    clear_indent: true
    latin_font: "inherit"

custom_styles:
  - id: "ae"
    name: "文章的正文"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: 1.5
      first_line_chars: 2
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "Times New Roman"
      size_half_pt: 24
      size_cs_half_pt: 28

  - id: "Cankaowenxian"
    name: "参考文献"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: "22pt"
      spacing_before_dxa: 60
      spacing_after_dxa: 60
      indent_clear: true
      word_wrap_break_latin: true
    run:
      latin_font: "inherit"
      size_half_pt: 24
      size_cs_half_pt: 24

  - id: "TuStyle"
    name: "图"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      spacing_before_dxa: 120
      spacing_after_dxa: 0
      indent_clear: true
      word_wrap_break_latin: true

  - id: "图注"
    name: "图注"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      indent_clear: true
      word_wrap_break_latin: true
    run:
      latin_font: "inherit"
      size_half_pt: 20

  - id: "表注"
    name: "表注"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      indent_clear: true
      word_wrap_break_latin: true
    run:
      latin_font: "inherit"
      size_half_pt: 20
