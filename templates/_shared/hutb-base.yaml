# Shared base DSL for HUTB templates.
extends: "./list-style-library.yaml"

default_list_style: "DecimalList"

use_list_styles:
  - id: "DecimalList"
  - id: "BulletList"
  - id: "ParenDecimalList"
  - id: "CircledList"
  - id: "ChineseList"

fonts:
  latin: "Times New Roman"
  cjk: "宋体"

overrides:
  - match: { kind: "body" }
    word_wrap_break_latin: true
  - match: { kind: "heading" }
    word_wrap_break_latin: true
    clear_indent: true
    latin_font: "inherit"

custom_styles:
  - id: "ae"
    name: "文章的正文"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: 1.5
      first_line_chars: 2
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 28

  - id: "Cankaowenxian"
    name: "参考文献"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: "single"
      spacing_before_dxa: 60
      spacing_after_dxa: 60
      hanging_indent_chars: 2
      word_wrap_break_latin: true
    run:
      latin_font: "inherit"
      size_half_pt: 21

  - id: "TuStyle"
    name: "图"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      spacing_before_dxa: 120
      spacing_after_dxa: 0
      indent_clear: true
      word_wrap_break_latin: true

  - id: "图注"
    name: "图注"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      spacing_before_dxa: 0
      spacing_after_dxa: 120
      indent_clear: true
      word_wrap_break_latin: true
    run:
      latin_font: "inherit"
      size_half_pt: 20
