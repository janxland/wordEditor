    based_on: "ListBase"
    list: { num_fmt: "bullet", lvl_text: "□", suff: "space" }

  - id: "HeartOutlineList"
    name: "♡ 空心爱心列表"
    based_on: "ListBase"
    list: { num_fmt: "bullet", lvl_text: "♡", suff: "space" }

  - id: "HeartSolidList"
    name: "♥ 实心爱心列表"
    based_on: "ListBase"
    list: { num_fmt: "bullet", lvl_text: "♥", suff: "space" }

  - id: "HashList"
    name: "# 井号列表"
    based_on: "ListBase"
    list: { num_fmt: "bullet", lvl_text: "#", suff: "space" }

  - id: "CrownList"
    name: "♛ 皇冠列表"
    based_on: "ListBase"
