# Shared list style library for templates.

list_style_library:
  - id: "ListBase"
    name: "List Base"
    based_on: "a"
    description: "Base style for all generated lists"
    paragraph:
      align: "both"
      line_spacing: "22pt"
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      indent_clear: true
      first_line_chars: 0
      hanging_indent_chars: 0
    run:
      cjk_font: "宋体"
      latin_font: "inherit"
      size_half_pt: 24
    list:
      num_fmt: "none"
      lvl_text: ""
      suff: "nothing"

  - id: "DecimalList"
    name: "Decimal List"
    based_on: "ListBase"
    description: "1. 2. 3."
    list:
      num_fmt: "decimal"
      lvl_text: "%1."
      suff: "space"
      start: 1

  - id: "BulletList"
    name: "Bullet List"
    based_on: "ListBase"
    description: "Bullet list"
    list:
      num_fmt: "bullet"
      lvl_text: "•"
      suff: "space"

  - id: "ParenDecimalList"
    name: "Paren Decimal List"
    based_on: "ListBase"
    description: "(1) (2)"
    list:
      num_fmt: "decimal"
      lvl_text: "(%1)"
      suff: "space"
      start: 1

  - id: "CircledList"
    name: "Circled Number List"
    based_on: "ListBase"
    description: "① ② ③"
    list:
      num_fmt: "decimalEnclosedCircle"
      lvl_text: "%1"
      suff: "space"
      start: 1

  - id: "ChineseList"
    name: "Chinese Counting List"
    based_on: "ListBase"
    description: "一、二、三"
    list:
      num_fmt: "chineseCounting"
      lvl_text: "%1、"
      suff: "nothing"
      start: 1
