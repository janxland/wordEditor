extends: "../_shared/hutb-base.yaml"
template:
  id: "hutb-math-modeling"
  name: "湖南工商大学 · 数学建模"
overrides:
  - match:
      id: "1"         # 标题 1 段落
    paragraph:
      page_break_before: true   # 每个一级标题前自动分页（新章节起新页）
    run:
      cjk_font: "黑体"
      latin_font: "黑体"
      size_half_pt: 28
      size_cs_half_pt: 28
      bold: true
  - match:
      id: "2"         # 标题 2 段落
    paragraph:
      first_line_chars: 2
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 28
      size_cs_half_pt: 28
      bold: true
  - match:
      id: "3"         # 标题 3 段落
    paragraph:
      first_line_chars: 2
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 28
      size_cs_half_pt: 28
      bold: true
  - match:
      id: "10"        # 标题 1 字符
    run:
      cjk_font: "黑体"
      latin_font: "黑体"
      size_half_pt: 28
      bold: true
  - match:
      id: "11"        # 标题 2 字符
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 28
      bold: true
  - match:
      id: "12"        # 标题 3 字符
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 28
      bold: true
custom_styles:
  - id: "Title"
    name: "Title"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      spacing_before_dxa: 240
      spacing_after_dxa: 240
      word_wrap_break_latin: true
    run:
      cjk_font: "黑体"
      latin_font: "Times New Roman"
      size_half_pt: 36
      size_cs_half_pt: 36
      bold: true
  # 代码块（Pandoc fenced code）：当作普通附件正文，黑色宋体小四，22 磅固定行距，无首行缩进
  - id: "SourceCode"
    name: "Source Code"
    based_on: "a"
    paragraph:
      align: "left"
      line_spacing: "22pt"
      indent_clear: true
      first_line_chars: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
      color: "000000"
  # 行内代码字符样式：同样强制黑色宋体
  - id: "VerbatimChar"
    name: "Verbatim Char"
    based_on: "a0"
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
      color: "000000"
fonts: {}
multilevel_list:
  num_id: 2
  levels:
    - ilvl: 0
      heading_style: "1"
      num_fmt: "chineseCounting"
      lvl_text: "%1、"
      suff: "nothing"
      start: 1
    - ilvl: 1
      heading_style: "2"
      num_fmt: "decimal"
      lvl_text: "%1.%2"
      suff: "space"
      start: 1
      is_lgl: true
    - ilvl: 2
      heading_style: "3"
      num_fmt: "decimal"
      lvl_text: "%1.%2.%3"
      suff: "space"
      start: 1
      is_lgl: true
    - ilvl: 3
      heading_style: "4"
      num_fmt: "decimal"
      lvl_text: "%1.%2.%3.%4"
      suff: "space"
      start: 1
      is_lgl: true
use_list_styles:
  - id: "DecimalList"






