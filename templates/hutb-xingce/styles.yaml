extends: "../_shared/list-style-library.yaml"
template:
  id: "hutb-xingce"
  name: "湖南工商大学 · 形策论文 1500 字模板"

default_list_style: "DecimalList"

use_list_styles:
  - id: "DecimalList"
  - id: "BulletList"
  - id: "ParenDecimalList"
  - id: "CircledList"
  - id: "ChineseList"
custom_styles:
  - id: "ZhaiYaoTitle"
    name: "摘要标题"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      indent_clear: true
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 36
      size_cs_half_pt: 36
      bold: true
  - id: "ZhaiYao"
    name: "摘要"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: 1.5
      first_line_chars: 2
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
  - id: "KeyWordsZh"
    name: "关键词"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: 1.5
      first_line_chars: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
  - id: "Title"
    name: "Title"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      spacing_before_dxa: 240
      spacing_after_dxa: 240
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "Times New Roman"
      size_half_pt: 44
      size_cs_half_pt: 44
      bold: true
  - id: "ae"
    name: "文章的正文"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: "22pt"
      first_line_chars: 2
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "Times New Roman"
      size_half_pt: 30
      size_cs_half_pt: 30
overrides:
  - match: { kind: "body" }
    word_wrap_break_latin: true
  - match: { kind: "heading" }
    word_wrap_break_latin: true
    clear_indent: true
    latin_font: "inherit"
  - match:
      id: "1"         # 标题 1 段落
    paragraph:
      spacing_before_dxa: 0
      spacing_after_dxa: 0
fonts:
  latin: "Times New Roman"
  cjk: "宋体"
multilevel_list:
  num_id: 2
  levels:
    - ilvl: 0
      heading_style: "1"
      num_fmt: "chineseCounting"
      lvl_text: "%1、"
      suff: "nothing"
      start: 1
    - ilvl: 1
      heading_style: "2"
      num_fmt: "decimal"
      lvl_text: "%1.%2"
      suff: "space"
      start: 1
      is_lgl: true
    - ilvl: 2
      heading_style: "3"
      num_fmt: "decimal"
      lvl_text: "%1.%2.%3"
      suff: "space"
      start: 1
      is_lgl: true
    - ilvl: 3
      heading_style: "4"
      num_fmt: "decimal"
      lvl_text: "%1.%2.%3.%4"
      suff: "space"
      start: 1
      is_lgl: true
