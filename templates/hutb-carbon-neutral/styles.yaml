extends: "../_shared/hutb-base.yaml"
template:
  id: "hutb-carbon-neutral"
  name: "湖南工商大学 · 碳中和（自定义）"
overrides: []
custom_styles: []
fonts: {}
multilevel_list:
  num_id: 2
  levels:
    - ilvl: 0
      heading_style: "1"
      num_fmt: "chineseCounting"
      lvl_text: "%1、"
      suff: "nothing"
      start: 1
      is_lgl: true
    - ilvl: 1
      heading_style: "2"
      num_fmt: "decimal"
      lvl_text: "（%2）"
      suff: "space"
      start: 1
      is_lgl: true
    - ilvl: 2
      heading_style: "3"
      num_fmt: "decimal"
      lvl_text: "%3."
      suff: "space"
      start: 1
      is_lgl: true
    - ilvl: 3
      heading_style: "4"
      num_fmt: "upperLetter"
      lvl_text: "%4"
      suff: "space"
      start: 1
      is_lgl: true
