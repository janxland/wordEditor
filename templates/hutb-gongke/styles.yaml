# 湖南工商大学 · 工科：H1=1 H2=1.1 H3=1.1.1 H4=1.1.1.1 全程 isLgl 阿拉伯编号
extends: "../_shared/hutb-base.yaml"
template:
  id: "hutb-gongke"
  name: "湖南工商大学 · 工科"

overrides: []
custom_styles:
  # 代码块（Pandoc fenced code）：附件代码，黑色宋体小四，22pt 固定行距，无首行缩进
  # 与 hutb-math-modeling 对齐
  - id: "SourceCode"
    name: "Source Code"
    based_on: "a"
    paragraph:
      align: "left"
      line_spacing: "22pt"
      indent_clear: true
      first_line_chars: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
      color: "000000"
  # 行内代码字符样式：同样强制黑色宋体
  - id: "VerbatimChar"
    name: "Verbatim Char"
    based_on: "a0"
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
      color: "000000"
fonts: {}

multilevel_list:
  num_id: 2
  levels:
    - ilvl: 0
      heading_style: "1"
      num_fmt: "decimal"
      lvl_text: "%1"
      suff: "space"
      start: 1
    - ilvl: 1
      heading_style: "2"
      num_fmt: "decimal"
      lvl_text: "%1.%2"
      suff: "space"
      start: 1
      is_lgl: true
    - ilvl: 2
      heading_style: "3"
      num_fmt: "decimal"
      lvl_text: "%1.%2.%3"
      suff: "space"
      start: 1
      is_lgl: true
    - ilvl: 3
      heading_style: "4"
      num_fmt: "decimal"
      lvl_text: "%1.%2.%3.%4"
      suff: "space"
      start: 1
      is_lgl: true
