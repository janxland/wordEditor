# 湖南工商大学 · 工科：H1=1 H2=1.1 H3=1.1.1 H4=1.1.1.1 全程 isLgl 阿拉伯编号
extends: "../_shared/list-style-library.yaml"
template:
  id: "hutb-gongke"
  name: "湖南工商大学 · 工科"

default_list_style: "DecimalList"

use_list_styles:
  - id: "DecimalList"
  - id: "BulletList"
  - id: "ParenDecimalList"
  - id: "CircledList"
  - id: "ChineseList"

overrides:
  - match: { kind: "body" }
    word_wrap_break_latin: true
  - match: { kind: "heading" }
    word_wrap_break_latin: true
    clear_indent: true
    latin_font: "inherit"
  - match:
      id: "1"         # 标题 1 段落
    paragraph:
      align: "left"
      line_spacing: "single"
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      page_break_before: true   # 每个一级标题前自动分页（新章节起新页）
    run:
      cjk_font: "黑体"
      latin_font: "黑体"
      size_half_pt: 28
      size_cs_half_pt: 28
      bold: true
  - match:
      id: "2"         # 标题 2 段落
    paragraph:
      first_line_chars: 2
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 28
      size_cs_half_pt: 28
      bold: true
  - match:
      id: "3"         # 标题 3 段落
    paragraph:
      first_line_chars: 2
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 28
      size_cs_half_pt: 28
      bold: true
  - match:
      id: "10"        # 标题 1 字符
    run:
      cjk_font: "黑体"
      latin_font: "黑体"
      size_half_pt: 28
      bold: true
  - match:
      id: "11"        # 标题 2 字符
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 28
      bold: true
  - match:
      id: "12"        # 标题 3 字符
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 28
      bold: true
custom_styles:
  - id: "ZhaiYaoTitle"
    name: "摘要标题"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      indent_clear: true
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 36
      size_cs_half_pt: 36
      bold: true
  - id: "ZhaiYao"
    name: "摘要"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: 1.5
      first_line_chars: 2
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
  - id: "KeyWordsZh"
    name: "关键词"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: 1.5
      first_line_chars: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
  # 代码块（Pandoc fenced code）：附件代码，黑色宋体小四，22pt 固定行距，无首行缩进
  # 与 hutb-math-modeling 对齐
  - id: "SourceCode"
    name: "Source Code"
    based_on: "a"
    paragraph:
      align: "left"
      line_spacing: "22pt"
      indent_clear: true
      first_line_chars: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
      color: "000000"
  # 行内代码字符样式：同样强制黑色宋体
  - id: "VerbatimChar"
    name: "Verbatim Char"
    based_on: "a0"
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
      color: "000000"
fonts:
  latin: "Times New Roman"
  cjk: "宋体"

multilevel_list:
  num_id: 2
  levels:
    - ilvl: 0
      heading_style: "1"
      num_fmt: "decimal"
      lvl_text: "%1"
      suff: "space"
      start: 1
    - ilvl: 1
      heading_style: "2"
      num_fmt: "decimal"
      lvl_text: "%1.%2"
      suff: "space"
      start: 1
      is_lgl: true
    - ilvl: 2
      heading_style: "3"
      num_fmt: "decimal"
      lvl_text: "%1.%2.%3"
      suff: "space"
      start: 1
      is_lgl: true
    - ilvl: 3
      heading_style: "4"
      num_fmt: "decimal"
      lvl_text: "%1.%2.%3.%4"
      suff: "space"
      start: 1
      is_lgl: true



