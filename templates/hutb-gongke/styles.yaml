# 湖南工商大学 · 工科：H1=1 H2=1.1 H3=1.1.1 H4=1.1.1.1 全程 isLgl 阿拉伯编号
extends: "../_shared/hutb-base.yaml"
template:
  id: "hutb-gongke"
  name: "湖南工商大学 · 工科"

default_list_style: "DecimalList"

use_list_styles:
  - id: "DecimalList"
  - id: "BulletList"
  - id: "ParenDecimalList"
  - id: "CircledList"
  - id: "ChineseList"

overrides:
  - match: { kind: "body" }
    word_wrap_break_latin: true
  - match: { kind: "heading" }
    word_wrap_break_latin: true
    clear_indent: true
    latin_font: "inherit"
  - match:
      id: "1"
    paragraph:
      align: "left"
      line_spacing: "single"
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      page_break_before: true
    run:
      cjk_font: "黑体"
      latin_font: "黑体"
      size_half_pt: 28
      size_cs_half_pt: 28
      bold: true
  - match:
      id: "2"
    paragraph:
      first_line_chars: 2
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
      bold: true
  - match:
      id: "3"
    paragraph:
      first_line_chars: 2
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
      bold: true
  - match:
      id: "10"
    run:
      cjk_font: "黑体"
      latin_font: "黑体"
      size_half_pt: 28
      bold: true
  - match:
      id: "11"
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      bold: true
  - match:
      id: "12"
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      bold: true
custom_styles:
  - id: "ZhaiYaoTitle"
    name: "摘要标题"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      indent_clear: true
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 36
      size_cs_half_pt: 36
      bold: true
  - id: "AbstractTitle"
    name: "Abstract Title"
    based_on: "a"
    paragraph:
      align: "center"
      line_spacing: "single"
      indent_clear: true
      spacing_before_dxa: 0
      spacing_after_dxa: 0
      word_wrap_break_latin: true
    run:
      latin_font: "Times New Roman"
      size_half_pt: 36
      size_cs_half_pt: 36
      bold: true
  - id: "ZhaiYao"
    name: "摘要"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: 1.5
      first_line_chars: 2
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
  - id: "Abstract"
    name: "Abstract"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: "22pt"
      first_line_chars: 2
      word_wrap_break_latin: true
    run:
      latin_font: "Times New Roman"
      cjk_font: "Times New Roman"
      size_half_pt: 24
      size_cs_half_pt: 24
  - id: "KeyWordsZh"
    name: "关键词"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: 1.5
      first_line_chars: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
  - id: "Keywords"
    name: "Keywords"
    based_on: "a"
    paragraph:
      align: "both"
      line_spacing: "22pt"
      first_line_chars: 0
      word_wrap_break_latin: true
    run:
      latin_font: "Times New Roman"
      cjk_font: "Times New Roman"
      size_half_pt: 24
      size_cs_half_pt: 24
  - id: "SourceCode"
    name: "Source Code"
    based_on: "a"
    paragraph:
      align: "left"
      line_spacing: "22pt"
      indent_clear: true
      first_line_chars: 0
      word_wrap_break_latin: true
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
      color: "000000"
  - id: "VerbatimChar"
    name: "Verbatim Char"
    based_on: "a0"
    run:
      cjk_font: "宋体"
      latin_font: "宋体"
      size_half_pt: 24
      size_cs_half_pt: 24
      color: "000000"
fonts:
  latin: "Times New Roman"
  cjk: "宋体"

multilevel_list:
  num_id: 2
  levels:
    # 一级：四号黑体居左，单倍行距
    - ilvl: 0
      heading_style: "1"
      num_fmt: "decimal"
      lvl_text: "%1"
      suff: "space"
      start: 1
      run:
        cjk_font: "黑体"
        size_half_pt: 28
        size_cs_half_pt: 28
        bold: true
      paragraph:
        align: "left"
        line_spacing: "single"
        first_line_chars: 0
        spacing_before_dxa: 0
        spacing_after_dxa: 0

    # 二级：小四宋体首行缩进2字符，单倍行距
    - ilvl: 1
      heading_style: "2"
      num_fmt: "decimal"
      lvl_text: "%1.%2"
      suff: "space"
      start: 1
      is_lgl: true
      run:
        cjk_font: "宋体"
        size_half_pt: 24
        size_cs_half_pt: 24
        bold: true
      paragraph:
        align: "left"
        line_spacing: "single"
        first_line_chars: 2
        spacing_before_dxa: 0
        spacing_after_dxa: 0

    # 三级：小四宋体首行缩进2字符，单倍行距
    - ilvl: 2
      heading_style: "3"
      num_fmt: "decimal"
      lvl_text: "%1.%2.%3"
      suff: "space"
      start: 1
      is_lgl: true
      run:
        cjk_font: "宋体"
        size_half_pt: 24
        size_cs_half_pt: 24
        bold: true
      paragraph:
        align: "left"
        line_spacing: "single"
        first_line_chars: 2
        spacing_before_dxa: 0
        spacing_after_dxa: 0

    # 四级：同三级
    - ilvl: 3
      heading_style: "4"
      num_fmt: "decimal"
      lvl_text: "%1.%2.%3.%4"
      suff: "space"
      start: 1
      is_lgl: true
      run:
        cjk_font: "宋体"
        size_half_pt: 24
        size_cs_half_pt: 24
        bold: true
      paragraph:
        align: "left"
        line_spacing: "single"
        first_line_chars: 2
        spacing_before_dxa: 0
        spacing_after_dxa: 0
